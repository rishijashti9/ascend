# Dependency updates (hardening V-16): weekly pull requests, grouped so there are few of them.
# CI runs on each, so an update that breaks anything shows up red before it can be merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    groups:
      android:
        patterns: ['*']
