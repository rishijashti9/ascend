# Continuous integration (hardening V-06): every push and pull request runs the same gate as the
# laptop (`npm run check`), the end-to-end suite and the Android build. Needs no secrets.
# Actions are pinned to exact commit SHAs (a moved tag can't change what runs); Dependabot
# proposes updates.
name: CI

on:
  push:
    branches: [main, 'hardening/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Check + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check, lint, format, unit + integration tests
        # The unit tests check dates as the app shows them in the device's locale and time zone;
        # run them like the development laptop (Indian English, India time). Without this a
        # US/UTC runner fails 4 tests ("Oct 1, 2027" vs "1 Oct 2027") — a test assumption, not
        # an app bug. Only for this step: the locale isn't installed on the runner, which breaks
        # Chromium's handling of non-ASCII file paths in e2e (Playwright pins the e2e locale).
        env:
          LANG: en_IN.UTF-8 # Node's ICU takes its default locale from this
          TZ: Asia/Kolkata
        run: npm run check
      - name: Install the e2e browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (phone + laptop)
        run: npm run e2e
      - name: Keep the Playwright report when e2e fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  android:
    name: Android unit tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build the web app into the Android project
        run: npm run build && npx cap sync android
      - name: JUnit tests, debug APK, Android lint
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
