<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ASCEND — Level up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#03050A}
a{color:#7CC8FF}a:hover{color:#B5E0FF}
@keyframes ringOut{0%{transform:translate(-50%,-50%) scale(.4);opacity:.9}100%{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
@keyframes floatUp{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-260px);opacity:0}}
@keyframes titleIn{0%{letter-spacing:22px;opacity:0;filter:blur(8px)}100%{letter-spacing:8px;opacity:1;filter:blur(0)}}
@keyframes glowBreath{0%,100%{text-shadow:0 0 18px rgba(90,184,255,.8),0 0 42px rgba(90,184,255,.45)}50%{text-shadow:0 0 28px rgba(140,210,255,1),0 0 70px rgba(90,184,255,.7)}}
@keyframes rowIn{0%{transform:translateX(-14px);opacity:0}100%{transform:none;opacity:1}}
.ring{position:absolute;left:50%;top:300px;border-radius:999px;border:1.5px solid rgba(124,200,255,.55);animation:ringOut 3.2s ease-out infinite}
.spark{position:absolute;bottom:80px;width:3px;height:3px;border-radius:999px;background:#9FD8FF;box-shadow:0 0 8px #7CC8FF;animation:floatUp 4s linear infinite}
.lv-title{animation:titleIn 1.1s cubic-bezier(.2,.8,.2,1) both, glowBreath 2.6s ease-in-out 1.1s infinite}
.gain{animation:rowIn .5s ease-out both}
.cta:hover{box-shadow:0 0 28px rgba(90,184,255,.75)}
@media (prefers-reduced-motion: reduce){.ring,.spark,.lv-title,.gain{animation:none !important;opacity:1}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #E7EEF9; background-color: #03050A; background-image: radial-gradient(360px 360px at 50% 300px, rgba(60,130,255,0.35), rgba(3,5,10,0) 70%); display: flex; flex-direction: column; align-items: center">

  <div class="ring" aria-hidden="true" style="width: 220px; height: 220px; animation-delay: 0s"></div>
  <div class="ring" aria-hidden="true" style="width: 220px; height: 220px; animation-delay: 1.05s"></div>
  <div class="ring" aria-hidden="true" style="width: 220px; height: 220px; animation-delay: 2.1s"></div>
  <sc-for list="{{sparks}}" as="s" hint-placeholder-count="14">
    <span class="spark" aria-hidden="true" style="{{s.style}}"></span>
  </sc-for>

  <div style="position: relative; margin-top: 64px; display: flex; flex-direction: column; align-items: center; gap: 6px">
    <span style="font-family: 'Chakra Petch', sans-serif; font-size: 12px; letter-spacing: 4px; color: #7CC8FF">[ SYSTEM NOTICE ]</span>
    <span style="font-size: 13px; color: #98A6BD">Your effort has been recognised.</span>
  </div>

  <div style="position: relative; margin-top: 70px; width: 200px; height: 200px; display: flex; align-items: center; justify-content: center">
    <svg width="200" height="200" viewBox="0 0 200 200" aria-hidden="true" style="position: absolute; inset: 0; filter: drop-shadow(0 0 16px rgba(90,184,255,0.7))">
      <polygon points="100,8 180,54 180,146 100,192 20,146 20,54" fill="rgba(10,20,40,0.85)" stroke="{{accent}}" stroke-width="2"></polygon>
      <polygon points="100,26 164,63 164,137 100,174 36,137 36,63" fill="none" stroke="rgba(124,200,255,0.35)" stroke-width="1"></polygon>
    </svg>
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px">
      <span style="font-size: 12px; letter-spacing: 3px; color: #98A6BD">LEVEL</span>
      <span style="font-family: 'Chakra Petch', sans-serif; font-size: 72px; font-weight: 700; line-height: 1; color: #FFFFFF; text-shadow: 0 0 24px rgba(90,184,255,0.9)">5</span>
      <span style="font-family: 'Chakra Petch', sans-serif; font-size: 13px; color: #7CC8FF">4 → 5</span>
    </div>
  </div>

  <h1 class="lv-title" style="position: relative; margin: 34px 0 0 0; font-family: 'Chakra Petch', sans-serif; font-size: 36px; font-weight: 700; letter-spacing: 8px; color: #EAF6FF">LEVEL UP</h1>

  <div style="position: relative; margin-top: 26px; width: 310px; border-radius: 14px; padding: 14px 16px; background: rgba(12,20,36,0.82); border: 1px solid rgba(90,184,255,0.3); display: flex; flex-direction: column; gap: 10px">
    <div class="gain" style="display: flex; justify-content: space-between; align-items: center; animation-delay: 0.9s"><span style="font-family: 'Chakra Petch', sans-serif; letter-spacing: 1.5px; color: #7FE3F0">INT</span><span style="font-size: 13px; color: #CFE6FF">4 → 5 <span style="color: #2BB5C8; font-weight: 600">▲</span></span></div>
    <div class="gain" style="display: flex; justify-content: space-between; align-items: center; animation-delay: 1.1s"><span style="font-family: 'Chakra Petch', sans-serif; letter-spacing: 1.5px; color: #C4B2FF">WIL</span><span style="font-size: 13px; color: #CFE6FF">3 · +40 XP</span></div>
    <div style="height: 1px; background: rgba(124,200,255,0.18)"></div>
    <div class="gain" style="display: flex; align-items: center; gap: 10px; animation-delay: 1.3s">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFD27A" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg>
      <span style="font-size: 13px; color: #FFE6B0">Title unlocked · <span style="font-weight: 600">First Light</span></span>
    </div>
  </div>

  <a href="Main.dc.html" class="cta" style="position: relative; margin-top: auto; margin-bottom: 44px; width: 310px; height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 14px; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 3px; color: #04101F; background: linear-gradient(90deg, #6FC2FF, {{accent}}); box-shadow: 0 0 18px rgba(90,184,255,0.5)">CONTINUE</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5AB8FF","options":["#5AB8FF","#9B7BFF","#2BB5C8","#F0894B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#5AB8FF';
    const sparks = [];
    for (let i = 0; i < 14; i++) {
      const left = 20 + ((i * 53) % 350);
      const delay = ((i * 0.37) % 4).toFixed(2);
      const size = i % 3 === 0 ? 4 : 3;
      sparks.push({ style: 'left: ' + left + 'px; width: ' + size + 'px; height: ' + size + 'px; animation-delay: ' + delay + 's' });
    }
    return { accent, sparks };
  }
}
</script>
</body>
</html>
