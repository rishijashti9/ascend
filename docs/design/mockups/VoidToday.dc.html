<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
body{margin:0;background:#0B0F14}
a{color:#3DF2E0}a:hover{color:#A8FFF6}
@keyframes vPulse{0%,100%{box-shadow:0 0 0 0 rgba(61,242,224,.6)}50%{box-shadow:0 0 0 7px rgba(61,242,224,0)}}
@keyframes vShine{0%{transform:translateX(-120%)}100%{transform:translateX(330%)}}
@keyframes vBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes vFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.v-dot{animation:vPulse 2.2s ease-in-out infinite}
.v-shine{animation:vShine 3.4s ease-in-out infinite}
.v-eye{animation:vBlink 4s infinite;transform-origin:center}
.v-bot{animation:vFloat 3s ease-in-out infinite}
.v-q:active{transform:scale(.98)}
@media (prefers-reduced-motion: reduce){.v-dot,.v-shine,.v-eye,.v-bot{animation:none !important}}
</style>

        <span role="img" aria-label="Rank E" style="width: 40px; height: 40px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: Unbounded, sans-serif; font-weight: 700; color: #0B0F14; background: #3DF2E0; box-shadow: 0 0 18px rgba(61,242,224,0.55)">E</span>

      <div style="display: flex; justify-content: space-between; align-items: flex-end">

        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <div style="padding: 10px; border-radius: 14px; background: rgba(228,69,255,0.08); border: 1px solid rgba(228,69,255,0.25); display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; letter-spacing: 1.5px; color: #F6B6FF">STR</span><span style="font-family: Unbounded, sans-serif; font-size: 18px; font-weight: 600">2</span></div>
        <div style="padding: 10px; border-radius: 14px; background: rgba(61,242,224,0.08); border: 1px solid rgba(61,242,224,0.25); display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; letter-spacing: 1.5px; color: #A8FFF6">INT</span><span style="font-family: Unbounded, sans-serif; font-size: 18px; font-weight: 600">4</span></div>

      <div class="v-bot" style="width: 46px; height: 46px; flex-shrink: 0">
        <svg width="46" height="46" viewBox="0 0 46 46" role="img" aria-label="System companion">
          <rect x="22" y="1" width="2" height="6" rx="1" fill="#3DF2E0"></rect>
          <circle cx="23" cy="2" r="2.5" fill="#3DF2E0"></circle>
          <rect x="5" y="8" width="36" height="32" rx="11" fill="#EEF3F7"></rect>
          <rect x="10" y="14" width="26" height="18" rx="7" fill="#0B0F14"></rect>
          <g class="v-eye"><circle cx="18" cy="23" r="2.6" fill="#3DF2E0"></circle><circle cx="28" cy="23" r="2.6" fill="#3DF2E0"></circle></g>
        </svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <span style="display: flex; align-items: center; gap: 6px; font-family: Unbounded, sans-serif; font-size: 10px; letter-spacing: 2px; color: #3DF2E0"><span class="v-dot" style="width: 7px; height: 7px; border-radius: 999px; background: #3DF2E0"></span>SYSTEM</span>
        <span style="font-size: 14px; line-height: 1.4; color: #E9F2F5">{{systemMsg}}</span>

    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-family: Unbounded, sans-serif; font-size: 14px; font-weight: 600">Daily quests</span>
      <span style="font-size: 13px; color: #8C9AA8; font-variant-numeric: tabular-nums">{{doneCount}} of 8 done</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{quests}}" as="q" hint-placeholder-count="4">
        <button class="v-q" type="button" onClick="{{q.pick}}" aria-pressed="{{q.done}}" style="{{q.cardStyle}}">
          <span style="{{q.checkStyle}}">
            <sc-if value="{{q.done}}" hint-placeholder-val="{{false}}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0B0F14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </sc-if>
          </span>
          <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; text-align: left; min-width: 0">
            <span style="font-size: 14px; font-weight: 600; color: #FFFFFF">{{q.title}}</span>
            <span style="font-size: 12px; color: #8C9AA8">{{q.meta}}</span>
          </span>
          <span style="font-family: Unbounded, sans-serif; font-size: 11px; color: {{q.color}}">+{{q.xp}}</span>
        </button>

  <nav aria-label="Main" style="margin: 0 16px 16px 16px; height: 64px; border-radius: 22px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10)">

    <a href="VoidToday.dc.html" aria-label="Focus" style="justify-self: center; color: #8C9AA8; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2.5M9 2h6"></path></svg></a>

    <a href="VoidLevelUp.dc.html" aria-label="More" style="justify-self: center; color: #8C9AA8; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: { wake: true, study: false, workout: false, walk: false } };
  }
  renderVals() {
    const done = this.state.done;
    const defs = [
      { id: 'wake', title: 'Wake up on time', meta: "I'm up · 4:58", xp: 25, color: '#8A6CFF' },
      { id: 'study', title: 'AI & Robotics study', meta: '90 / 150 min', xp: 50, color: '#3DF2E0' },
      { id: 'workout', title: 'Workout', meta: '30 min · min 10 push-ups', xp: 25, color: '#E445FF' },
      { id: 'walk', title: 'Walk', meta: '6,240 / 8,000 steps', xp: 10, color: '#E445FF' }
    ];
    let gained = 0;
    const quests = defs.map((d) => {
      const isDone = !!done[d.id];
      if (isDone && d.id !== 'wake') gained += d.xp;
      const base = 'width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; font-family: inherit; cursor: pointer; transition: all 240ms ease; ';
      return {
        title: d.title, meta: d.meta, xp: d.xp, color: d.color, done: isDone,
        cardStyle: base + (isDone
          ? 'background: rgba(255,255,255,0.05); border: 1px solid ' + d.color + '; box-shadow: 0 0 20px ' + d.color + '33;'
          : 'background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.08);'),
        checkStyle: 'width: 26px; height: 26px; flex-shrink: 0; border-radius: 9px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; ' + (isDone
          ? 'background: ' + d.color + '; box-shadow: 0 0 12px ' + d.color + ';'
          : 'border: 1.5px solid ' + d.color + ';'),
        pick: () => this.setState({ done: Object.assign({}, done, { [d.id]: !isDone }) })
      };
    });
    const xp = Math.min(340 + gained, 520);
    return {
      level: 4, xpText: xp + ' / 520', xpPct: Math.round(xp / 520 * 100) + '%',
      quests, doneCount: 2 + quests.filter((q) => q.done).length,
      systemMsg: gained >= 75 ? 'Core quests cleared. Well done, Player.' : 'Two core quests left. Start with study — 60 min to go.'
    };
  }
}
</script>
