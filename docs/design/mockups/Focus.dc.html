<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ASCEND — Focus</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#04060B}
a{color:#7CC8FF}a:hover{color:#B5E0FF}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.04)}}
.orbit{animation:spin 18s linear infinite;transform-origin:50% 50%}
.aura{animation:breathe 4s ease-in-out infinite}
.btn:hover{border-color:rgba(124,200,255,.6)}
@media (prefers-reduced-motion: reduce){.orbit,.aura{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #E7EEF9; background-color: #04060B; background-image: radial-gradient(300px 300px at 50% 360px, rgba(43,181,200,0.16), rgba(4,6,11,0) 70%); display: flex; flex-direction: column; align-items: center; padding: 26px 22px 40px 22px">

  <div style="width: 100%; display: flex; justify-content: space-between; align-items: center">
    <a href="Main.dc.html" aria-label="Back to Today" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: #98A6BD">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-family: 'Chakra Petch', sans-serif; font-size: 13px; letter-spacing: 4px; color: #7FE3F0; font-weight: 600">DUNGEON</span>
    <span style="font-size: 12px; color: #98A6BD; font-variant-numeric: tabular-nums">2 / 3</span>
  </div>

  <div style="margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 8px">
    <span style="font-family: 'Chakra Petch', sans-serif; font-size: 22px; font-weight: 600; color: #FFFFFF">AI &amp; Robotics study</span>
    <div style="display: flex; gap: 8px">
      <span style="padding: 4px 10px; border-radius: 999px; font-size: 12px; color: #7FE3F0; background: rgba(43,181,200,0.12); border: 1px solid rgba(43,181,200,0.3)">ROS 2</span>
      <span style="padding: 4px 10px; border-radius: 999px; font-size: 12px; color: #C9D3E3; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1)">Phone-free</span>
    </div>
  </div>

  <div style="position: relative; margin-top: 34px; width: 280px; height: 280px">
    <div class="aura" aria-hidden="true" style="position: absolute; inset: 20px; border-radius: 999px; background: radial-gradient(circle, rgba(43,181,200,0.28), rgba(43,181,200,0) 70%)"></div>
    <svg width="280" height="280" viewBox="0 0 280 280" aria-hidden="true" style="position: absolute; inset: 0">
      <circle cx="140" cy="140" r="118" fill="none" stroke="rgba(43,181,200,0.12)" stroke-width="10"></circle>
      <circle cx="140" cy="140" r="118" fill="none" stroke="{{accent}}" stroke-width="10" stroke-linecap="round" stroke-dasharray="{{dash}}" transform="rotate(-90 140 140)" style="filter: drop-shadow(0 0 10px rgba(43,181,200,0.8))"></circle>
      <g class="orbit"><circle cx="140" cy="10" r="3" fill="#BFF4FF"></circle><circle cx="140" cy="140" r="134" fill="none" stroke="rgba(124,200,255,0.18)" stroke-width="1" stroke-dasharray="2 10"></circle></g>
    </svg>
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
      <span style="font-family: 'Chakra Petch', sans-serif; font-size: 64px; font-weight: 600; line-height: 1; letter-spacing: 2px; color: #FFFFFF; font-variant-numeric: tabular-nums">18:42</span>
      <span style="font-size: 12px; letter-spacing: 2px; color: #98A6BD">OF 25:00</span>
    </div>
  </div>

  <div style="margin-top: 30px; width: 100%; border-radius: 14px; padding: 14px 16px; box-sizing: border-box; background: rgba(12,20,34,0.8); border: 1px solid rgba(43,181,200,0.25); display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-size: 13px"><span style="color: #98A6BD">Quest progress</span><span style="color: #CFE6FF; font-variant-numeric: tabular-nums">96 → 121 / 150 min</span></div>
    <div style="position: relative; height: 6px; border-radius: 999px; background: rgba(43,181,200,0.14)">
      <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 64%; border-radius: 999px; background: #2BB5C8"></div>
      <div style="position: absolute; left: 64%; top: 0; bottom: 0; width: 17%; border-radius: 999px; background: rgba(43,181,200,0.45)"></div>
    </div>
    <span style="font-size: 12px; color: #7D8AA3">Finish this session to reach your full target soon.</span>
  </div>

  <div style="margin-top: auto; width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <button type="button" class="btn" style="height: 52px; border-radius: 14px; font-family: 'Chakra Petch', sans-serif; font-size: 15px; letter-spacing: 2px; font-weight: 600; color: #E7EEF9; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14); cursor: pointer">PAUSE</button>
    <button type="button" class="btn" style="height: 52px; border-radius: 14px; font-family: 'Chakra Petch', sans-serif; font-size: 15px; letter-spacing: 2px; font-weight: 600; color: #FFB4A6; background: rgba(229,83,75,0.08); border: 1px solid rgba(229,83,75,0.3); cursor: pointer">END</button>
  </div>
  <span style="margin-top: 14px; font-size: 12px; color: #7D8AA3">Place your phone face-down. The System is watching the clock.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2BB5C8","options":["#2BB5C8","#5AB8FF","#9B7BFF","#F0894B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#2BB5C8';
    const circ = 2 * Math.PI * 118;
    const ratio = 1 - (18 * 60 + 42) / (25 * 60);
    return { accent, dash: (circ * ratio).toFixed(1) + ' ' + circ.toFixed(1) };
  }
}
</script>
</body>
</html>
