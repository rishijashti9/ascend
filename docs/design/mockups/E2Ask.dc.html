<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ASCEND — Ask the System</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000000}
a{color:#C8F03C}a:hover{color:#E2FF8A}
.e-x{font-family:Archivo,sans-serif;font-stretch:125%;font-weight:800;letter-spacing:-0.3px}
@keyframes sheetUp{0%{transform:translateY(40px);opacity:0}100%{transform:none;opacity:1}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.sheet{animation:sheetUp .45s cubic-bezier(.2,.8,.2,1) both}
.eye{animation:blink 4s infinite;transform-origin:center}
@media (prefers-reduced-motion: reduce){.sheet,.eye{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #FFFFFF; background: #000000">
  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 24px 20px; display: flex; flex-direction: column; gap: 12px; opacity: 0.35; filter: blur(2px)">
    <div style="height: 40px; width: 180px; border-radius: 12px; background: #1C1C1C"></div>
    <div style="height: 112px; border-radius: 22px; background: #C8F03C"></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><div style="height: 118px; border-radius: 22px; background: #F2F2F2"></div><div style="height: 118px; border-radius: 22px; background: #FFE14D"></div></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.55)"></div>

  <div class="sheet" role="dialog" aria-label="Ask the System" style="position: absolute; left: 0; right: 0; bottom: 0; height: 640px; box-sizing: border-box; border-radius: 32px 32px 0 0; background: #111111; border-top: 1px solid #262626; padding: 12px 18px 18px 18px; display: flex; flex-direction: column; gap: 14px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #333333"></span>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 44px; height: 44px; border-radius: 999px; background: #C8F03C; display: flex; align-items: center; justify-content: center">
          <svg width="28" height="28" viewBox="0 0 46 46" aria-hidden="true"><rect x="22" y="2" width="2" height="6" rx="1" fill="#000000"></rect><circle cx="23" cy="3" r="2.5" fill="#000000"></circle><rect x="5" y="9" width="36" height="31" rx="11" fill="#000000"></rect><g class="eye"><circle cx="17" cy="24" r="3" fill="#C8F03C"></circle><circle cx="29" cy="24" r="3" fill="#C8F03C"></circle></g></svg>
        </span>
        <span style="display: flex; flex-direction: column"><span class="e-x" style="font-size: 17px">Ask the System</span><span style="font-size: 11px; color: #8A8A8A">Career &amp; health only</span></span>
      </div>
      <a href="E2Today.dc.html" aria-label="Close" style="width: 40px; height: 40px; border-radius: 999px; background: #1E1E1E; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 11px; color: #8A8A8A">You're on (tap to preview other screens)</span>
      <div style="display: flex; gap: 6px">
        <sc-for list="{{contexts}}" as="c" hint-placeholder-count="4">
          <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.active}}" style="{{c.style}}">{{c.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 600">Suggested</span>
      <sc-for list="{{suggestions}}" as="s" hint-placeholder-count="3">
        <button type="button" onClick="{{s.pick}}" style="display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; border: 1px solid #262626; background: #1A1A1A; color: #FFFFFF; font-family: inherit; font-size: 13px; text-align: left; cursor: pointer">{{s.q}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C8F03C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg></button>
      </sc-for>
    </div>

    <sc-if value="{{hasAnswer}}" hint-placeholder-val="{{false}}">
      <div style="padding: 14px; border-radius: 18px; background: #C8F03C; color: #000000; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 11px; font-weight: 700; opacity: 0.6">SYSTEM</span>
        <span style="font-size: 13px; line-height: 1.45; font-weight: 500">{{answer}}</span>
        <span style="font-size: 11px; font-weight: 700">Sources: Growth Compass roadmap · official docs</span>
      </div>
    </sc-if>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; gap: 8px; align-items: center">
        <label for="askInput" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Your question</label>
        <input id="askInput" type="text" placeholder="Ask about your career or health…" style="flex-grow: 1; height: 50px; box-sizing: border-box; padding: 0 18px; border-radius: 999px; border: 1px solid #262626; background: #1A1A1A; color: #FFFFFF; font-family: inherit; font-size: 14px">
        <button type="button" aria-label="Send" style="width: 50px; height: 50px; border-radius: 999px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
      </div>
      <span style="font-size: 11px; color: #6E6E6E; text-align: center">{{privacy}}</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { ctx: 'Today', answer: '' };
  }
  renderVals() {
    const { ctx, answer } = this.state;
    const data = {
      Today: { qs: ['What should I do right now?', 'How do I keep my streak on a busy day?', 'Why is my game dev goal behind?'], a: 'Start your AI & Robotics block now — 60 minutes finishes your core quests. Do Walk later as a break.' },
      Roadmap: { qs: ['What should I learn after ROS 2 basics?', 'Is C++ or Python more important for robotics?', 'Which project shows my skills best?'], a: 'After ROS 2 basics, learn Nav2 navigation and TF transforms, then build a small simulated robot that maps a room (SLAM). Check versions on the official ROS 2 docs.' },
      Focus: { qs: ['How do I stay focused longer?', '25 or 50 minute sessions for me?', 'What to do in a break?'], a: 'Your sessions after 8 PM are often stopped early. Try 50/10 sessions in the morning, and keep the phone face-down.' },
      Body: { qs: ['How can I sleep better?', 'Simple home workout for beginners?', 'How much walking is enough?'], a: 'WHO suggests 150–300 minutes of moderate activity a week. A daily 30-minute walk covers most of it. For any pain or illness, please see a doctor.' }
    };
    const contexts = Object.keys(data).map((label) => ({
      label, active: label === ctx,
      style: 'padding: 8px 12px; border-radius: 999px; border: none; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; ' + (label === ctx ? 'background: #FFFFFF; color: #000000;' : 'background: #1E1E1E; color: #CFCFCF;'),
      pick: () => this.setState({ ctx: label, answer: '' })
    }));
    const suggestions = data[ctx].qs.map((q, i) => ({ q, pick: () => this.setState({ answer: i === 0 ? data[ctx].a : data[ctx].a }) }));
    const privacy = ctx === 'Body'
      ? 'General health answers only — your sleep, weight and mood are never sent.'
      : 'Only your question and progress numbers are sent — never health data or journal.';
    return { contexts, suggestions, answer, hasAnswer: answer !== '', privacy };
  }
}
</script>
</body>
</html>
