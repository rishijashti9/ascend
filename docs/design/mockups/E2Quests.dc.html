<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ASCEND — Quests</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000000}
a{color:#FFFFFF}a:hover{color:#D9D9D9}
.e-x{font-family:Archivo,sans-serif;font-stretch:125%;font-weight:800;letter-spacing:-0.3px}
.e-t{transition:transform 200ms cubic-bezier(.2,.8,.2,1),opacity 200ms ease}
.e-t:active{transform:scale(.97)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #FFFFFF; background: #000000; display: flex; flex-direction: column">
  <div style="padding: 24px 20px 0 20px; display: flex; flex-direction: column; gap: 14px; flex-grow: 1">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 class="e-x" style="margin: 0; font-size: 28px">Quests</h1>
      <button type="button" aria-label="Add quest" style="width: 44px; height: 44px; border-radius: 999px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
    </div>

    <div role="tablist" aria-label="Quest type" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #161616">
      <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{tb.active}}" onClick="{{tb.pick}}" style="{{tb.style}}">{{tb.label}}</button>
      </sc-for>
    </div>

    <sc-if value="{{isDaily}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; gap: 8px">
        <span style="padding: 8px 13px; border-radius: 999px; background: #FFFFFF; color: #000000; font-size: 12px; font-weight: 600">All</span>
        <span style="padding: 8px 13px; border-radius: 999px; background: #1C1C1C; color: #CFCFCF; font-size: 12px; font-weight: 600">Core</span>
        <span style="padding: 8px 13px; border-radius: 999px; background: #1C1C1C; color: #CFCFCF; font-size: 12px; font-weight: 600">Body</span>
        <span style="padding: 8px 13px; border-radius: 999px; background: #1C1C1C; color: #CFCFCF; font-size: 12px; font-weight: 600">Mind</span>
        <span style="padding: 8px 13px; border-radius: 999px; background: #1C1C1C; color: #CFCFCF; font-size: 12px; font-weight: 600">Career</span>
      </div>
    </sc-if>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{items}}" as="t" hint-placeholder-count="5">
        <button class="e-t" type="button" onClick="{{t.pick}}" aria-pressed="{{t.done}}" style="{{t.style}}">
          <span style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%">
            <span class="e-x" style="font-size: 16px; line-height: 1.1; text-align: left; white-space: pre-line">{{t.title}}</span>
            <span style="{{t.badge}}">
              <sc-if value="{{t.done}}" hint-placeholder-val="{{false}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
              <sc-if value="{{t.open}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg></sc-if>
            </span>
          </span>
          <span style="display: flex; justify-content: space-between; align-items: flex-end; width: 100%">
            <span style="font-size: 12px; font-weight: 500; opacity: 0.75; text-align: left">{{t.sub}}</span>
            <span class="e-x" style="font-size: 30px; line-height: 0.9">{{t.big}}</span>
          </span>
        </button>
      </sc-for>
    </div>
  </div>

  <a href="E2Ask.dc.html" aria-label="Ask the System" style="position: absolute; right: 18px; bottom: 104px; width: 56px; height: 56px; border-radius: 999px; background: #C8F03C; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 24px rgba(0,0,0,0.6)">
    <svg width="32" height="32" viewBox="0 0 46 46" aria-hidden="true"><rect x="22" y="2" width="2" height="6" rx="1" fill="#000000"></rect><circle cx="23" cy="3" r="2.5" fill="#000000"></circle><rect x="5" y="9" width="36" height="31" rx="11" fill="#000000"></rect><circle cx="17" cy="24" r="3" fill="#C8F03C"></circle><circle cx="29" cy="24" r="3" fill="#C8F03C"></circle></svg>
  </a>

  <nav aria-label="Main" style="margin: 0 16px 16px 16px; height: 70px; border-radius: 26px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; background: #161616; border: 1px solid #262626">
    <a href="E2Today.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #8A8A8A; font-size: 10px"><span style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2"></path></svg></span>Today</a>
    <a href="E2Quests.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #000000; font-size: 10px"><span style="width: 38px; height: 38px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg></span><span style="color: #FFFFFF; font-weight: 600">Quests</span></a>
    <a href="E2Focus.dc.html" aria-label="Focus" style="justify-self: center; margin-top: -30px; width: 62px; height: 62px; border-radius: 999px; background: #C8F03C; color: #000000; display: flex; align-items: center; justify-content: center; border: 5px solid #000000"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2.5M9 2h6"></path></svg></a>
    <a href="E2Growth.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #8A8A8A; font-size: 10px"><span style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19l5-6 4 3 7-9"></path><path d="M15 7h5v5"></path></svg></span>Growth</a>
    <a href="E2Me.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #8A8A8A; font-size: 10px"><span style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></span>Me</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'Daily', done: { wake: true } };
  }
  renderVals() {
    const { tab, done } = this.state;
    const sets = {
      Daily: [
        { id: 'study', title: 'AI & Robotics\nStudy', sub: '90 / 150 min', big: '90', bg: '#C8F03C', fg: '#000000', span: 2, h: 126 },
        { id: 'walk', title: 'Walk', sub: 'of 8,000', big: '6.2K', bg: '#F2F2F2', fg: '#000000', span: 1, h: 126 },
        { id: 'workout', title: 'Workout', sub: 'min', big: '30', bg: '#FFE14D', fg: '#000000', span: 1, h: 126 },
        { id: 'wake', title: 'Wake up', sub: "I'm up · 4:58", big: '', bg: '#2A2A2A', fg: '#FFFFFF', span: 1, h: 100 },
        { id: 'game', title: 'Game dev', sub: '0 / 60 min', big: '0', bg: '#A35BFF', fg: '#FFFFFF', span: 1, h: 100 }
      ],
      Weekly: [
        { id: 'w1', title: 'ROS 2 nav\ntutorial', sub: 'Core robotics skills', big: '1/2', bg: '#C8F03C', fg: '#000000', span: 2, h: 120 },
        { id: 'w2', title: 'Mock IELTS\ntest', sub: 'MS in Germany', big: '0/1', bg: '#1E9BFF', fg: '#FFFFFF', span: 1, h: 126 },
        { id: 'w3', title: 'Repo\nREADME', sub: 'Portfolio', big: '0/1', bg: '#F2F2F2', fg: '#000000', span: 1, h: 126 }
      ],
      Side: [
        { id: 's1', title: 'Book APS\nappointment', sub: 'Side quest · +10', big: '', bg: '#FF7A1A', fg: '#000000', span: 2, h: 110 },
        { id: 's2', title: 'Buy\ndumbbells', sub: 'Side quest · +10', big: '', bg: '#2A2A2A', fg: '#FFFFFF', span: 2, h: 96 }
      ]
    };
    const items = sets[tab].map((d) => {
      const isDone = !!done[d.id];
      return {
        title: d.title, sub: d.sub, big: d.big, done: isDone, open: !isDone,
        style: 'grid-column: span ' + d.span + '; min-height: ' + d.h + 'px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; padding: 14px; border-radius: 22px; border: none; font-family: inherit; cursor: pointer; background: ' + d.bg + '; color: ' + d.fg + '; ' + (isDone ? 'opacity: 0.5;' : ''),
        badge: 'width: 32px; height: 32px; flex-shrink: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center; ' + (d.fg === '#000000' ? 'background: #000000; color: #FFFFFF;' : 'background: #FFFFFF; color: #000000;'),
        pick: () => this.setState({ done: Object.assign({}, done, { [d.id]: !isDone }) })
      };
    });
    const tabs = ['Daily', 'Weekly', 'Side'].map((label) => ({
      label, active: label === tab,
      style: 'padding: 10px 0; border-radius: 999px; border: none; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; ' + (label === tab ? 'background: #FFFFFF; color: #000000;' : 'background: transparent; color: #CFCFCF;'),
      pick: () => this.setState({ tab: label })
    }));
    return { items, tabs, isDaily: tab === 'Daily' };
  }
}
</script>
</body>
</html>
