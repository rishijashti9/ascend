<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ASCEND ELEVATE — Today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000000}
a{color:#FFFFFF}a:hover{color:#D9D9D9}
.e-x{font-family:Archivo,sans-serif;font-stretch:125%;font-weight:800;letter-spacing:-0.3px}
.e-tile{transition:transform 220ms cubic-bezier(.2,.8,.2,1), opacity 220ms ease, box-shadow 220ms ease}
.e-tile:hover{transform:translateY(-2px)}
.e-tile:active{transform:scale(.97)}
.e-chip{transition:background 160ms ease,color 160ms ease}
@keyframes eIn{0%{transform:translateY(10px);opacity:0}100%{transform:none;opacity:1}}
.e-in{animation:eIn .4s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion: reduce){.e-in{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #FFFFFF; background-color: #000000; background-image: radial-gradient(500px 420px at 110% 0, rgba(255,255,255,0.07), rgba(0,0,0,0) 70%), radial-gradient(420px 380px at -10% 100%, rgba(255,255,255,0.05), rgba(0,0,0,0) 70%); display: flex; flex-direction: column">

  <div style="padding: 26px 20px 0 20px; display: flex; flex-direction: column; gap: 18px; flex-grow: 1">
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; align-items: center; gap: 12px">
        <svg width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="ASCEND"><rect width="40" height="40" rx="12" fill="#C8F03C"></rect><path d="M11 24l9-9 9 9M11 31l9-9 9 9" fill="none" stroke="#000000" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span class="e-x" style="font-size: 17px; line-height: 1.05">Rishi<br>Level 4<br><span style="color: #8A8A8A">Rank E</span></span>
      </div>
      <button type="button" aria-label="Search" style="width: 44px; height: 44px; border-radius: 999px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #8A8A8A"><span>Day 3 · 3-day streak</span><span style="color: #FFFFFF; font-variant-numeric: tabular-nums">{{xpText}} XP</span></div>
      <div style="height: 6px; border-radius: 999px; background: #1E1E1E; overflow: hidden"><div style="height: 100%; width: {{xpPct}}; border-radius: 999px; background: #C8F03C; transition: width 600ms cubic-bezier(.2,.8,.2,1)"></div></div>
    </div>

    <div role="tablist" aria-label="Filter quests" style="display: flex; gap: 8px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
        <button class="e-chip" type="button" role="tab" aria-selected="{{c.active}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
        <button class="e-tile e-in" type="button" onClick="{{t.pick}}" aria-pressed="{{t.done}}" style="{{t.style}}">
          <span style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%">
            <span class="e-x" style="font-size: {{t.titleSize}}; line-height: 1.05; text-align: left; white-space: pre-line">{{t.title}}</span>
            <span style="{{t.badgeStyle}}">
              <sc-if value="{{t.done}}" hint-placeholder-val="{{false}}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
              </sc-if>
              <sc-if value="{{t.open}}" hint-placeholder-val="{{true}}">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg>
              </sc-if>
            </span>
          </span>
          <span style="display: flex; justify-content: space-between; align-items: flex-end; width: 100%">
            <span style="font-size: 12px; font-weight: 500; text-align: left; opacity: 0.75">{{t.sub}}</span>
            <span class="e-x" style="font-size: 40px; line-height: 0.9">{{t.big}}</span>
          </span>
        </button>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Main" style="margin: 0 20px 18px 20px; height: 66px; border-radius: 999px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; background: #161616; border: 1px solid #262626">
    <a href="ElevateToday.dc.html" aria-current="page" aria-label="Today" style="justify-self: center; width: 48px; height: 48px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; color: #000000"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2"></path></svg></a>
    <a href="ElevateToday.dc.html" aria-label="Quests" style="justify-self: center; color: #8A8A8A; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg></a>
    <a href="ElevateToday.dc.html" aria-label="Focus" style="justify-self: center; color: #8A8A8A; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2.5M9 2h6"></path></svg></a>
    <a href="ElevateToday.dc.html" aria-label="Goals" style="justify-self: center; color: #8A8A8A; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4.5"></circle></svg></a>
    <a href="ElevateLevelUp.dc.html" aria-label="More" style="justify-self: center; color: #8A8A8A; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'All', done: { wake: true, study: false, workout: false, walk: false, meditate: false } };
  }
  renderVals() {
    const { filter, done } = this.state;
    const defs = [
      { id: 'study', title: 'AI & Robotics\nStudy', sub: '90 / 150 min · phone-free', big: '90', xp: 50, bg: '#C8F03C', fg: '#000000', span: 2, h: 150, size: '24px', tags: ['Core', 'Career'] },
      { id: 'walk', title: 'Walk', sub: 'of 8,000 steps', big: '6.2K', xp: 10, bg: '#F2F2F2', fg: '#000000', span: 1, h: 150, size: '16px', tags: ['Body'] },
      { id: 'workout', title: 'Workout', sub: 'min · or 10 push-ups', big: '30', xp: 25, bg: '#FFE14D', fg: '#000000', span: 1, h: 150, size: '16px', tags: ['Core', 'Body'] },
      { id: 'wake', title: 'WAKE UP\nON TIME', sub: "I'm up · 4:58", big: '', xp: 25, bg: '#2A2A2A', fg: '#FFFFFF', span: 2, h: 86, size: '18px', tags: ['Core', 'Mind'] },
      { id: 'meditate', title: 'Meditate', sub: '10 min · min 2', big: '10', xp: 10, bg: '#A35BFF', fg: '#FFFFFF', span: 2, h: 80, size: '16px', tags: ['Mind'] }
    ];
    let gained = 0;
    defs.forEach((d) => { if (done[d.id] && d.id !== 'wake') gained += d.xp; });
    const visible = defs.filter((d) => filter === 'All' || d.tags.indexOf(filter) !== -1);
    const tiles = visible.map((d) => {
      const isDone = !!done[d.id];
      return {
        title: d.title, sub: d.sub, big: d.big, titleSize: d.size, done: isDone, open: !isDone,
        style: 'grid-column: span ' + d.span + '; min-height: ' + d.h + 'px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; padding: 16px; border-radius: 22px; border: none; font-family: inherit; cursor: pointer; text-align: left; background: ' + d.bg + '; color: ' + d.fg + '; ' + (isDone ? 'opacity: 0.55;' : 'box-shadow: 0 18px 30px rgba(0,0,0,0.5);'),
        badgeStyle: 'width: 34px; height: 34px; flex-shrink: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center; ' + (d.fg === '#000000' ? 'background: #000000; color: #FFFFFF;' : 'background: #FFFFFF; color: #000000;'),
        pick: () => this.setState({ done: Object.assign({}, done, { [d.id]: !isDone }) })
      };
    });
    const chips = ['All', 'Core', 'Body', 'Mind', 'Career'].map((label) => {
      const active = label === filter;
      return {
        label, active,
        style: 'padding: 9px 14px; border-radius: 999px; border: none; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; ' + (active ? 'background: #FFFFFF; color: #000000;' : 'background: #1C1C1C; color: #CFCFCF;'),
        pick: () => this.setState({ filter: label })
      };
    });
    const xp = Math.min(340 + gained, 520);
    return { tiles, chips, xpText: xp + ' / 520', xpPct: Math.round(xp / 520 * 100) + '%' };
  }
}
</script>
</body>
</html>
