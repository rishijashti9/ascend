<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ASCEND — Profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#05070D}
a{color:#7CC8FF}a:hover{color:#B5E0FF}
@keyframes emblem{0%,100%{filter:drop-shadow(0 0 8px rgba(155,123,255,.5))}50%{filter:drop-shadow(0 0 18px rgba(155,123,255,.9))}}
.emblem{animation:emblem 3.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.emblem{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #E7EEF9; background-color: #05070D; background-image: radial-gradient(420px 260px at 50% 0, rgba(155,123,255,0.18), rgba(5,7,13,0) 70%); padding: 24px 20px; display: flex; flex-direction: column; gap: 16px">

  <div style="display: flex; justify-content: space-between; align-items: center">
    <a href="Main.dc.html" aria-label="Back to Today" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: #98A6BD">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-family: 'Chakra Petch', sans-serif; font-size: 13px; letter-spacing: 4px; color: #C4B2FF; font-weight: 600">PLAYER STATUS</span>
    <span style="width: 44px"></span>
  </div>

  <div style="border-radius: 18px; padding: 18px; background: rgba(16,18,36,0.82); border: 1px solid rgba(155,123,255,0.32); box-shadow: 0 0 30px rgba(155,123,255,0.14); display: flex; align-items: center; gap: 16px">
    <div class="emblem" style="position: relative; width: 84px; height: 84px; flex-shrink: 0">
      <svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true"><polygon points="42,3 78,23 78,61 42,81 6,61 6,23" fill="rgba(30,24,60,0.95)" stroke="#9B7BFF" stroke-width="2"></polygon></svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
        <span style="font-size: 9px; letter-spacing: 2px; color: #B9A8FF">RANK</span>
        <span style="font-family: 'Chakra Petch', sans-serif; font-size: 30px; font-weight: 700; line-height: 1; color: #FFFFFF">E</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
      <span style="font-family: 'Chakra Petch', sans-serif; font-size: 22px; font-weight: 600; color: #FFFFFF">Rishi</span>
      <span style="font-size: 13px; color: #C4B2FF">Lv 4 · First Light</span>
      <span style="font-size: 12px; color: #98A6BD">Next rank D · Lv 5 + 14 active days</span>
      <div style="height: 5px; width: 190px; border-radius: 999px; background: rgba(155,123,255,0.16)"><div style="width: 22%; height: 5px; border-radius: 999px; background: #9B7BFF"></div></div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <div style="border-radius: 16px; padding: 12px; background: rgba(14,22,38,0.8); border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; align-items: center; gap: 6px">
      <span style="align-self: flex-start; font-family: 'Chakra Petch', sans-serif; font-size: 11px; letter-spacing: 2px; color: #98A6BD">STATS</span>
      <svg width="140" height="128" viewBox="0 0 140 128" role="img" aria-label="Stats: STR 2, INT 4, WIL 3">
        <polygon points="70,12 128,112 12,112" fill="none" stroke="rgba(255,255,255,0.12)"></polygon>
        <polygon points="70,45 99,95 41,95" fill="none" stroke="rgba(255,255,255,0.07)"></polygon>
        <polygon points="70,30 104,104 48,99" fill="rgba(90,184,255,0.22)" stroke="#5AB8FF" stroke-width="1.5"></polygon>
        <text x="70" y="8" fill="#7FE3F0" font-size="10" text-anchor="middle" font-family="Chakra Petch">INT 4</text>
        <text x="130" y="124" fill="#C4B2FF" font-size="10" text-anchor="end" font-family="Chakra Petch">WIL 3</text>
        <text x="10" y="124" fill="#FFB48A" font-size="10" font-family="Chakra Petch">STR 2</text>
      </svg>
    </div>
    <div style="border-radius: 16px; padding: 12px; background: rgba(14,22,38,0.8); border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 10px">
      <span style="font-family: 'Chakra Petch', sans-serif; font-size: 11px; letter-spacing: 2px; color: #98A6BD">LIFETIME</span>
      <div style="display: flex; flex-direction: column"><span style="font-family: 'Chakra Petch', sans-serif; font-size: 24px; font-weight: 700">3</span><span style="font-size: 12px; color: #98A6BD">days active</span></div>
      <div style="display: flex; flex-direction: column"><span style="font-family: 'Chakra Petch', sans-serif; font-size: 24px; font-weight: 700">6.5 h</span><span style="font-size: 12px; color: #98A6BD">focused</span></div>
      <div style="display: flex; flex-direction: column"><span style="font-family: 'Chakra Petch', sans-serif; font-size: 24px; font-weight: 700">1</span><span style="font-size: 12px; color: #98A6BD">shield ready</span></div>
    </div>
  </div>

  <div style="border-radius: 16px; padding: 14px; background: rgba(14,22,38,0.8); border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between"><span style="font-family: 'Chakra Petch', sans-serif; font-size: 11px; letter-spacing: 2px; color: #98A6BD">ACTIVITY · 12 WEEKS</span><span style="font-size: 11px; color: #7D8AA3">Daily Clear = brightest</span></div>
    <div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="84">
        <span aria-hidden="true" style="{{c.style}}"></span>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-family: 'Chakra Petch', sans-serif; font-size: 11px; letter-spacing: 2px; color: #98A6BD">ACHIEVEMENTS · 2 / 46</span>
    <div style="display: flex; gap: 10px">
      <div style="flex: 1; border-radius: 14px; padding: 12px; background: rgba(255,210,122,0.07); border: 1px solid rgba(255,210,122,0.3); display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'Chakra Petch', sans-serif; font-size: 14px; font-weight: 600; color: #FFE6B0">First Light</span><span style="font-size: 11px; color: #C9B88F">3 on-time wake-ups</span>
      </div>
      <div style="flex: 1; border-radius: 14px; padding: 12px; background: rgba(124,200,255,0.07); border: 1px solid rgba(124,200,255,0.28); display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'Chakra Petch', sans-serif; font-size: 14px; font-weight: 600; color: #CFE6FF">Awakened</span><span style="font-size: 11px; color: #98A6BD">Finished onboarding</span>
      </div>
      <div style="flex: 1; border-radius: 14px; padding: 12px; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.15); display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'Chakra Petch', sans-serif; font-size: 14px; font-weight: 600; color: #7D8AA3">Iron Habit</span><span style="font-size: 11px; color: #6B778C">3 / 30 days</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cells = [];
    for (let i = 0; i < 84; i++) {
      let bg = 'rgba(255,255,255,0.05)';
      if (i >= 81) bg = i === 83 ? 'rgba(90,184,255,0.95)' : 'rgba(90,184,255,0.55)';
      const shadow = i === 83 ? '; box-shadow: 0 0 8px rgba(90,184,255,0.9)' : '';
      cells.push({ style: 'display: block; aspect-ratio: 1; border-radius: 3px; background: ' + bg + shadow });
    }
    return { cells };
  }
}
</script>
</body>
</html>
